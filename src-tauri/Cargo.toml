[workspace]
members = [".", "crates/ipc-schema"]

[package]
name = "kubix"
version = "0.1.0"
edition = "2021"
description = "Kubix — a free and open-source Kubernetes desktop IDE"
license = "Apache-2.0"
rust-version = "1.77"

[lib]
name = "kubix_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "0.99", default-features = false, features = ["client", "config", "rustls-tls", "ring", "ws", "runtime"] }
k8s-openapi = { version = "0.24", features = ["latest"] }
schemars = { version = "0.8", features = ["preserve_order"] }
home = "0.5"
futures = "0.3"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["full"] }

[features]
default = ["app", "custom-protocol"]
app = []
custom-protocol = ["tauri/custom-protocol"]
